{% extends "base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<div class="glass">
  <h2>Reset password</h2>
  <p class="sub">Enter your email and we'll send you a reset link.</p>
  <form method="post">{% csrf_token %}
    <div class="field"><label>Email</label>{{ form.email }}{% for e in form.email.errors %}<div class="err">{{ e }}</div>{% endfor %}</div>
    <button class="btn" type="submit">Send reset link</button>
  </form>
  <p class="alt"><a href="{% url 'login' %}">Back to login</a></p>
</div>
{% endblock %}
